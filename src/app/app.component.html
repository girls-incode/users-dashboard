<header class="page-header">
  <div class="logo-wrap">
    <img src="/logo.svg" alt="awork logo" class="brand-logo" />
  </div>
</header>

<main class="page-content">
  <app-user-list-toolbar [(search)]="search" [groupOptions]="groupOptions" [selectedGroup]="selectedGroup()"
    [currentPage]="currentPage()" (groupChange)="selectGroup($event)" (previousPage)="previousPage()"
    (nextPage)="nextPage()" />

  <section class="list-panel">
    @if (isLoading() || isGrouping()) {
    <div class="loading-state">
      <div class="loading-spinner"></div>
    </div>
    } @else if (errorMessage()) {
    <p class="error-state" role="alert">{{ errorMessage() }}</p>
    } @else {
    @if (groups().length) {
    <p class="list-count">Users: {{ displayedUserCount() }}</p>
    }
    <app-user-list [groups]="groups()"></app-user-list>
    }
  </section>
</main>
