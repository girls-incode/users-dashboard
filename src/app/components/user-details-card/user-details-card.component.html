<div class="user-details-card">
  @if (loading()) {
    <div class="user-details-card__skeleton" aria-hidden="true">
      @for (row of [1, 2, 3, 4]; track row) {
        <span class="user-details-card__skeleton-row"></span>
      }
    </div>
  } @else {
    <div class="user-details-card__row">
      <span>Age</span>
      <strong>{{ details()?.age }}</strong>
    </div>
    <div class="user-details-card__row">
      <span>Gender</span>
      <strong>{{ details()?.gender }}</strong>
    </div>
    <div class="user-details-card__row">
      <span>Username</span>
      <strong>{{ details()?.username }}</strong>
    </div>
    <div class="user-details-card__row">
      <span>Phone</span>
      <strong>{{ details()?.phone }}</strong>
    </div>
  }
</div>
