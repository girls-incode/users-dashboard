<div class="user-details-card">
  @if (detailsResource.isLoading()) {
    <div class="user-details-card__skeleton" aria-hidden="true">
      @for (row of [1, 2, 3, 4]; track row) {
        <span class="user-details-card__skeleton-row"></span>
      }
    </div>
  } @else {
    <div class="user-details-card__row">
      <span>Age</span>
      <strong>{{ detailsResource.value()?.age }}</strong>
    </div>
    <div class="user-details-card__row">
      <span>Gender</span>
      <strong>{{ detailsResource.value()?.gender }}</strong>
    </div>
    <div class="user-details-card__row">
      <span>Username</span>
      <strong>{{ detailsResource.value()?.username }}</strong>
    </div>
    <div class="user-details-card__row">
      <span>Phone</span>
      <strong>{{ detailsResource.value()?.phone }}</strong>
    </div>
  }
</div>
